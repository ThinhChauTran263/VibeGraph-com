name: Frontend CI

on:
  pull_request:
    branches:
      - poc
      - develop
      - main
    paths:
      - 'vibegraph-web/**'
      - '.github/workflows/frontend.yml'
  push:
    branches:
      - poc
      - develop
      - main
    paths:
      - 'vibegraph-web/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint, test, and build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 — D-M4: SHA pin against supply-chain tag swapping

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 — D-M4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vibegraph-web/package-lock.json

      - name: Install dependencies
        run: npm --prefix vibegraph-web ci

      - name: Type check
        run: npm --prefix vibegraph-web run type-check

      - name: Run unit tests
        run: npm --prefix vibegraph-web run test:unit -- --run

      - name: Lint
        run: npm --prefix vibegraph-web run lint

      - name: Build
        run: npm --prefix vibegraph-web run build

      - name: Audit dependencies
        run: npm --prefix vibegraph-web audit --audit-level=high
