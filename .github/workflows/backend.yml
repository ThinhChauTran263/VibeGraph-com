name: Backend CI

on:
  pull_request:
    branches:
      - poc
      - develop
      - main
    paths:
      - 'pom.xml'
      - 'mvnw'
      - '.mvn/**'
      - 'src/**'
      - '.github/workflows/backend.yml'
  push:
    branches:
      - poc
      - develop
      - main
    paths:
      - 'pom.xml'
      - 'mvnw'
      - '.mvn/**'
      - 'src/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Compile and test backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 — D-M4: SHA pin against supply-chain tag swapping

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1 — D-M4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Build, test, and verify backend (JaCoCo coverage gate + integration tests)
        run: ./mvnw verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 — D-M4
        with:
          name: backend-test-reports
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
          if-no-files-found: ignore

# D-M4 part 2 (CD job) is intentionally NOT here yet: per the 13/08/2026 operator
# decision (A4), the registry choice (GHCR / Docker Hub / none) belongs to the repo
# owner. Add the build+push job once that decision lands; do not block CI on it.
