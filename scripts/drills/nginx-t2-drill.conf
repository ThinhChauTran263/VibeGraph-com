events {}
http {
  server {
    listen 8443 ssl;
    ssl_certificate /certs/tls.crt;
    ssl_certificate_key /certs/tls.key;
    # T2 drill: the proxy tells the backend the edge scheme via X-Forwarded-Proto.
    # AuthCookieService/StatelessSessionCookieFilter already trust this header
    # (pre-existing behaviour); the backend leg is plaintext HTTP, so isSecure()
    # alone can never see the TLS at the edge.
    location / {
      proxy_pass http://vibegraph-backend:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
