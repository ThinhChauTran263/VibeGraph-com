# VibeGraph — Prometheus alert rules (H17 / B-L8)
#
# The telemetry drop path is SILENT by design (best-effort queue shed), so these
# alerts are the only signal that security events are being lost. Ship them with
# whatever Prometheus scrapes the backend /actuator/prometheus endpoint; without
# them the H17 remediation is operationally incomplete.
#
# Metric names below are the Prometheus-normalized form of the Micrometer meters
# emitted by RequestEventService — VERIFIED against a live scrape of
# /actuator/prometheus (13/08/2026, B5): the endpoint returned
#   security_events_dropped_total 0.0
#   request_events_queue_fresh_size 0.0
# (counter is registered at RequestEventService construction, so it is present
# even before the first drop; the gauge reads the live queue).
# Note: /actuator/prometheus is ADMIN-only (S-M3); the scraper needs an admin
# session/token. On the docker profile the exposure lives in
# application-docker.yaml (Boot 4 key management.prometheus.metrics.export.enabled).

groups:
  - name: vibegraph-telemetry
    rules:
      - alert: SecurityEventsDropped
        expr: increase(security_events_dropped_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "VibeGraph is dropping security events"
          description: >
            The telemetry queue shed at least one security event in the last 5
            minutes. Drops are silent — investigate scheduler saturation (long
            trash purge) or a telemetry sink outage immediately.

      - alert: TelemetryQueueNearFull
        expr: request_events_queue_fresh_size > 8000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "VibeGraph telemetry queue above 80% of capacity"
          description: >
            The fresh telemetry queue has held more than 80% of its 10,000-entry
            capacity for 5 minutes. Once full, the queue sheds oldest-first and
            security events may be dropped (see SecurityEventsDropped).
