spring:
  neo4j:
    uri: bolt://neo4j:7687
    authentication:
      username: ${NEO4J_USERNAME}
      password: ${NEO4J_PASSWORD}

vibegraph:
  # Uploaded archives are materialized on the writable named volume (see docker-compose.yml),
  # never on the read-only /projects mount.
  import:
    archive:
      workspace-root: ${VIBEGRAPH_UPLOAD_WORKSPACE:/uploads}

  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
      - http://127.0.0.1:5173
      - ${FRONTEND_URL:http://localhost:3000}
