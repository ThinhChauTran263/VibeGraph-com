spring:
  neo4j:
    uri: bolt://neo4j:7687
    authentication:
      username: ${NEO4J_USERNAME}
      password: ${NEO4J_PASSWORD}

# B5/H17: expose the Prometheus scrape endpoint on the docker profile too (C2 enabled
# the export key for prod only). Boot 4 syntax — the Boot 2 key
# management.metrics.export.prometheus.* is silently ignored. S-M3 keeps every
# /actuator/** route ADMIN-only except /actuator/health.
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  prometheus:
    metrics:
      export:
        enabled: true

vibegraph:
  auth:
    api-key-encryption:
      current-key: ${API_KEY_ENCRYPTION_KEY_CURRENT:}
      previous-key: ${API_KEY_ENCRYPTION_KEY_PREVIOUS:}
      legacy-secret: ${API_KEY_ENCRYPTION_LEGACY_SECRET:${JWT_SECRET:}}

  cli:
    device:
      frontend-url: ${VIBEGRAPH_CLI_DEVICE_FRONTEND_URL:${FRONTEND_URL:http://localhost:3000}}
      ttl-seconds: ${VIBEGRAPH_CLI_DEVICE_TTL_SECONDS:600}
      poll-interval-seconds: ${VIBEGRAPH_CLI_DEVICE_POLL_INTERVAL_SECONDS:2}
      cleanup-cron: "${VIBEGRAPH_CLI_DEVICE_CLEANUP_CRON:0 20 3 * * ?}"

  mcp:
    orchestration:
      retention:
        enabled: ${VIBEGRAPH_MCP_TASK_RETENTION_ENABLED:true}
        retention-days: ${VIBEGRAPH_MCP_TASK_RETENTION_DAYS:90}
        batch-size: ${VIBEGRAPH_MCP_TASK_RETENTION_BATCH_SIZE:500}
        max-batches: ${VIBEGRAPH_MCP_TASK_RETENTION_MAX_BATCHES:20}
        cron: "${VIBEGRAPH_MCP_TASK_RETENTION_CRON:0 15 3 * * ?}"

  # Uploaded archives are materialized on the writable named volume (see docker-compose.yml),
  # never on the read-only /projects mount.
  import:
    archive:
      workspace-root: ${VIBEGRAPH_UPLOAD_WORKSPACE:/uploads}

  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
      - http://127.0.0.1:5173
      - ${FRONTEND_URL:http://localhost:3000}
