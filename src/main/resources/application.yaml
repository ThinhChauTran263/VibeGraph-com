spring:
  application:
    name: VibeGraph

  # Neo4j connection
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: vibegraph
    pool:
      max-connection-pool-size: 50

  data:
    neo4j:
      database: neo4j

  # Spring AI MCP Server
  ai:
    mcp:
      server:
        name: VibeGraph
        version: 1.0.0
        protocol: streamable

server:
  port: 8080
  servlet:
    context-path: /

# VibeGraph custom properties
vibegraph:
  watcher:
    enabled: true
    debounce-ms: 500
    ignored-paths:
      - target
      - build
      - .git
      - .idea
      - node_modules
    watched-extensions:
      - .java

  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000

  parser:
    use-cache: true
    cache-dir: .vibegraph/parse-cache

logging:
  level:
    root: INFO
    com.vibegraph: DEBUG
    org.springframework.data.neo4j: INFO

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized
