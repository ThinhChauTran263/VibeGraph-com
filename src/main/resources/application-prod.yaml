spring:
  application:
    name: VibeGraph

  # Neo4j connection - use environment variables for secrets
  neo4j:
    uri: ${NEO4J_URI:bolt://neo4j:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD}
    pool:
      max-connection-pool-size: 100
      connection-acquisition-timeout: 60s
      max-connection-lifetime: 1h

  data:
    neo4j:
      database: ${NEO4J_DATABASE:neo4j}

  # Spring AI MCP Server
  ai:
    mcp:
      server:
        name: VibeGraph
        version: 1.0.0
        protocol: streamable

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

# VibeGraph custom properties
vibegraph:
  watcher:
    enabled: false
    debounce-ms: 500
    ignored-paths:
      - target
      - build
      - .git
      - .idea
      - node_modules
    watched-extensions:
      - .java

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://vibegraph.io}

  parser:
    use-cache: true
    cache-dir: /app/data/parse-cache

  github:
    token: ${GITHUB_TOKEN:}
    max-repo-size-mb: 100

logging:
  level:
    root: WARN
    com.vibegraph: INFO
    org.springframework.data.neo4j: WARN
    org.springframework.web: WARN

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true
