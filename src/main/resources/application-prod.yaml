server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

spring:
  application:
    name: VibeGraph

  neo4j:
    uri: ${NEO4J_URI}
    authentication:
      username: ${NEO4J_USERNAME}
      password: ${NEO4J_PASSWORD}
    pool:
      max-connection-pool-size: ${NEO4J_MAX_CONNECTION_POOL_SIZE:100}
      connection-acquisition-timeout: ${NEO4J_CONNECTION_ACQUISITION_TIMEOUT:60s}
      max-connection-lifetime: ${NEO4J_MAX_CONNECTION_LIFETIME:1h}

  data:
    neo4j:
      database: ${NEO4J_DATABASE:neo4j}

  servlet:
    multipart:
      max-file-size: ${VIBEGRAPH_IMPORT_ARCHIVE_HARD_MAX_SIZE:200MB}
      max-request-size: ${VIBEGRAPH_IMPORT_ARCHIVE_HARD_MAX_REQUEST_SIZE:2050MB}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            redirect-uri: ${OAUTH_REDIRECT_BASE_URL}/login/oauth2/code/{registrationId}
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - read:user
              - user:email
            redirect-uri: ${OAUTH_REDIRECT_BASE_URL}/login/oauth2/code/{registrationId}

  ai:
    mcp:
      server:
        name: VibeGraph
        version: 1.0.0
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /mcp

vibegraph:
  auth:
    api-key-encryption:
      # No default in production: startup must fail instead of encrypting with a shared/dev key.
      current-key: ${API_KEY_ENCRYPTION_KEY_CURRENT}
      previous-key: ${API_KEY_ENCRYPTION_KEY_PREVIOUS:}
      legacy-secret: ${API_KEY_ENCRYPTION_LEGACY_SECRET:${JWT_SECRET:}}
    oauth:
      frontend-url: ${FRONTEND_URL}
      success-path: ${OAUTH_SUCCESS_PATH:/}
      login-path: ${OAUTH_LOGIN_PATH:/login}

  cli:
    device:
      frontend-url: ${VIBEGRAPH_CLI_DEVICE_FRONTEND_URL:${FRONTEND_URL}}
      ttl-seconds: ${VIBEGRAPH_CLI_DEVICE_TTL_SECONDS:600}
      poll-interval-seconds: ${VIBEGRAPH_CLI_DEVICE_POLL_INTERVAL_SECONDS:2}
      cleanup-cron: "${VIBEGRAPH_CLI_DEVICE_CLEANUP_CRON:0 20 3 * * ?}"

  mcp:
    orchestration:
      retention:
        enabled: ${VIBEGRAPH_MCP_TASK_RETENTION_ENABLED:true}
        retention-days: ${VIBEGRAPH_MCP_TASK_RETENTION_DAYS:90}
        batch-size: ${VIBEGRAPH_MCP_TASK_RETENTION_BATCH_SIZE:500}
        max-batches: ${VIBEGRAPH_MCP_TASK_RETENTION_MAX_BATCHES:20}
        cron: "${VIBEGRAPH_MCP_TASK_RETENTION_CRON:0 15 3 * * ?}"

  projects:
    allowed-root: ${VIBEGRAPH_PROJECTS_ALLOWED_ROOT:}

  import:
    archive:
      max-size: ${VIBEGRAPH_IMPORT_ARCHIVE_HARD_MAX_SIZE:200MB}
      workspace-root: ${VIBEGRAPH_UPLOAD_WORKSPACE:/app/data/uploads}

  watcher:
    enabled: ${VIBEGRAPH_WATCHER_ENABLED:false}
    debounce-ms: ${VIBEGRAPH_WATCHER_DEBOUNCE_MS:1000}
    ignored-paths:
      - target
      - build
      - .git
      - .idea
      - node_modules
    watched-extensions:
      - .java

  cors:
    allowed-origins:
      - ${FRONTEND_URL}

  abuse:
    concurrent-imports-per-user: ${VIBEGRAPH_CONCURRENT_IMPORTS_PER_USER:1}
    requests-per-minute-per-ip: ${VIBEGRAPH_REQUESTS_PER_MINUTE_PER_IP:120}
    requests-per-minute-per-user: ${VIBEGRAPH_REQUESTS_PER_MINUTE_PER_USER:240}
    requests-per-minute-per-api-key: ${VIBEGRAPH_REQUESTS_PER_MINUTE_PER_API_KEY:240}
    # Enable only when the immediate peer is a trusted reverse proxy.
    # Accepts exact IPs and CIDRs, e.g. 127.0.0.1,172.18.0.0/16.
    trust-proxy: ${VIBEGRAPH_TRUST_PROXY:false}
    trusted-proxies: ${VIBEGRAPH_TRUSTED_PROXIES:}

  parser:
    use-cache: ${VIBEGRAPH_PARSER_USE_CACHE:true}
    cache-dir: ${VIBEGRAPH_PARSER_CACHE_DIR:/app/data/parse-cache}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  # Spring Boot 3.0 moved this key from `management.metrics.export.prometheus.*` to
  # `management.prometheus.metrics.export.*`. On Boot 4 the old spelling is silently
  # ignored, so it read as "Prometheus is on" while the endpoint was never enabled.
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: WARN
    com.vibegraph: INFO
    org.springframework.web: WARN
    org.springframework.data.neo4j: WARN
