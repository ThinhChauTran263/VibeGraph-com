services:
  postgres:
    image: postgres:16.11-alpine
    container_name: vibegraph-postgres
    restart: unless-stopped
    ports:
      # H3: DB ports stay loopback-only; the backend reaches Postgres over the
      # compose network hostname, so nothing outside this host needs 5432.
      # Host side defaults to 5433 because dev machines often run a native
      # Postgres on 5432; override POSTGRES_PORT if the host port is free.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?Set POSTGRES_USER in .env} -d ${POSTGRES_DB:?Set POSTGRES_DB in .env}"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    # D-M2: pin the minor tag so the stack is reproducible.
    image: neo4j:5.26-community
    container_name: vibegraph-neo4j
    restart: unless-stopped
    ports:
      # H3: loopback-only; the backend connects via bolt://neo4j:7687 internally.
      - "127.0.0.1:7474:7474"   # HTTP browser
      - "127.0.0.1:7687:7687"   # Bolt protocol
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:?Set NEO4J_USERNAME in .env}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      NEO4J_PLUGINS: '["apoc"]'
      # H3: NEO4J_dbms_security_procedures_unrestricted=apoc.* removed — unrestricted
      # APOC can read files and execute code; the app only needs the default safe set.
      # Bound Neo4j JVM + page cache so a heavy analyze run can't exhaust host RAM
      # and freeze the whole machine. Tune up if you have headroom.
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_SIZE:-1G}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_SIZE:-1G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE_SIZE:-512M}
    # Hard container memory ceiling (heap + pagecache + JVM overhead + headroom).
    mem_limit: ${NEO4J_MEM_LIMIT:-2g}
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD", "wget", "-O", "/dev/null", "-q", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vibegraph-backend
    restart: unless-stopped
    # Must stay LONGER than SUPABASE_TELEMETRY_SHUTDOWN_DRAIN_TIMEOUT_MS, otherwise the container
    # is killed mid-drain and the queued telemetry batches are lost.
    stop_grace_period: 30s
    ports:
      # In production bind the backend to the host loopback so only the TLS
      # reverse proxy can reach it. Local .env.local may override this to 0.0.0.0.
      - "${SERVER_BIND_ADDRESS:-0.0.0.0}:${SERVER_PORT:?Set SERVER_PORT in .env}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_NEO4J_URI: bolt://neo4j:7687
      SERVER_PORT: 8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      VIBEGRAPH_SUPABASE_ENABLED: ${VIBEGRAPH_SUPABASE_ENABLED:-false}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:-}
      SUPABASE_DB_USER: ${SUPABASE_DB_USER:-}
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD:-}
      SUPABASE_DB_SCHEMA: ${SUPABASE_DB_SCHEMA:-vibegraph_realtime}
      SUPABASE_REQUIRE_SEPARATE_CREDENTIALS: ${SUPABASE_REQUIRE_SEPARATE_CREDENTIALS:-false}
      SUPABASE_MIGRATION_DB_URL: ${SUPABASE_MIGRATION_DB_URL:-}
      SUPABASE_MIGRATION_DB_USER: ${SUPABASE_MIGRATION_DB_USER:-}
      SUPABASE_MIGRATION_DB_PASSWORD: ${SUPABASE_MIGRATION_DB_PASSWORD:-}
      SUPABASE_DB_MAX_POOL_SIZE: ${SUPABASE_DB_MAX_POOL_SIZE:-10}
      SUPABASE_DB_CONNECTION_TIMEOUT_MS: ${SUPABASE_DB_CONNECTION_TIMEOUT_MS:-10000}
      SUPABASE_TELEMETRY_QUEUE_CAPACITY: ${SUPABASE_TELEMETRY_QUEUE_CAPACITY:-10000}
      SUPABASE_TELEMETRY_BATCH_SIZE: ${SUPABASE_TELEMETRY_BATCH_SIZE:-250}
      SUPABASE_TELEMETRY_FLUSH_INTERVAL_MS: ${SUPABASE_TELEMETRY_FLUSH_INTERVAL_MS:-2000}
      SUPABASE_TELEMETRY_RETRY_QUEUE_CAPACITY: ${SUPABASE_TELEMETRY_RETRY_QUEUE_CAPACITY:-200}
      SUPABASE_TELEMETRY_MAX_ATTEMPTS: ${SUPABASE_TELEMETRY_MAX_ATTEMPTS:-4}
      SUPABASE_TELEMETRY_RETRY_BACKOFF_MS: ${SUPABASE_TELEMETRY_RETRY_BACKOFF_MS:-1000}
      SUPABASE_TELEMETRY_MAX_RETRY_BACKOFF_MS: ${SUPABASE_TELEMETRY_MAX_RETRY_BACKOFF_MS:-60000}
      SUPABASE_TELEMETRY_RETRY_BATCHES_PER_CYCLE: ${SUPABASE_TELEMETRY_RETRY_BATCHES_PER_CYCLE:-2}
      SUPABASE_TELEMETRY_FRESH_BATCHES_PER_CYCLE: ${SUPABASE_TELEMETRY_FRESH_BATCHES_PER_CYCLE:-1}
      SUPABASE_TELEMETRY_MAX_SPLIT_DEPTH: ${SUPABASE_TELEMETRY_MAX_SPLIT_DEPTH:-4}
      SUPABASE_TELEMETRY_SHUTDOWN_DRAIN_TIMEOUT_MS: ${SUPABASE_TELEMETRY_SHUTDOWN_DRAIN_TIMEOUT_MS:-10000}
      SUPABASE_TELEMETRY_SHUTDOWN_RETRY_PAUSE_MS: ${SUPABASE_TELEMETRY_SHUTDOWN_RETRY_PAUSE_MS:-250}
      SUPABASE_RETENTION_REQUEST_EVENT_DAYS: ${SUPABASE_RETENTION_REQUEST_EVENT_DAYS:-14}
      SUPABASE_RETENTION_SECURITY_EVENT_DAYS: ${SUPABASE_RETENTION_SECURITY_EVENT_DAYS:-180}
      SUPABASE_RETENTION_DISMISSED_NOTIFICATION_DAYS: ${SUPABASE_RETENTION_DISMISSED_NOTIFICATION_DAYS:-90}
      SUPABASE_RETENTION_EXPIRED_ANNOUNCEMENT_DAYS: ${SUPABASE_RETENTION_EXPIRED_ANNOUNCEMENT_DAYS:-180}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      # Dedicated AES-256 API-key encryption key. Keep the previous key during rotation;
      # legacy-secret allows one deployment window for ciphertext created from JWT_SECRET.
      API_KEY_ENCRYPTION_KEY_CURRENT: ${API_KEY_ENCRYPTION_KEY_CURRENT:?Set API_KEY_ENCRYPTION_KEY_CURRENT in .env}
      API_KEY_ENCRYPTION_KEY_PREVIOUS: ${API_KEY_ENCRYPTION_KEY_PREVIOUS:-}
      API_KEY_ENCRYPTION_LEGACY_SECRET: ${API_KEY_ENCRYPTION_LEGACY_SECRET:-${JWT_SECRET:?Set JWT_SECRET in .env}}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-1800000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      # H4: session cookies default to Secure; set AUTH_COOKIE_SECURE=false in .env
      # only for plain-HTTP environments without TLS termination.
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-Lax}
      VIBEGRAPH_REALTIME_DEMO_PERMIT: ${VIBEGRAPH_REALTIME_DEMO_PERMIT:-false}
      VIBEGRAPH_AUTH_BOOTSTRAP_ENABLED: ${VIBEGRAPH_AUTH_BOOTSTRAP_ENABLED:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      NEO4J_USERNAME: ${NEO4J_USERNAME:?Set NEO4J_USERNAME in .env}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      NEO4J_DATABASE: ${NEO4J_DATABASE:?Set NEO4J_DATABASE in .env}
      NEO4J_MAX_CONNECTION_POOL_SIZE: ${NEO4J_MAX_CONNECTION_POOL_SIZE:?Set NEO4J_MAX_CONNECTION_POOL_SIZE in .env}
      NEO4J_CONNECTION_ACQUISITION_TIMEOUT: ${NEO4J_CONNECTION_ACQUISITION_TIMEOUT:?Set NEO4J_CONNECTION_ACQUISITION_TIMEOUT in .env}
      NEO4J_MAX_CONNECTION_LIFETIME: ${NEO4J_MAX_CONNECTION_LIFETIME:?Set NEO4J_MAX_CONNECTION_LIFETIME in .env}
      VIBEGRAPH_PROJECTS_ALLOWED_ROOT: ${VIBEGRAPH_PROJECTS_ALLOWED_ROOT:-}
      VIBEGRAPH_UPLOAD_WORKSPACE: /uploads
      VIBEGRAPH_IMPORT_ARCHIVE_HARD_MAX_SIZE: ${VIBEGRAPH_IMPORT_ARCHIVE_HARD_MAX_SIZE:-2048MB}
      VIBEGRAPH_IMPORT_ARCHIVE_HARD_MAX_REQUEST_SIZE: ${VIBEGRAPH_IMPORT_ARCHIVE_HARD_MAX_REQUEST_SIZE:-2050MB}
      VIBEGRAPH_PARSER_CACHE_DIR: ${VIBEGRAPH_PARSER_CACHE_DIR:?Set VIBEGRAPH_PARSER_CACHE_DIR in .env}
      VIBEGRAPH_WATCHER_ENABLED: ${VIBEGRAPH_WATCHER_ENABLED:?Set VIBEGRAPH_WATCHER_ENABLED in .env}
      VIBEGRAPH_WATCHER_DEBOUNCE_MS: ${VIBEGRAPH_WATCHER_DEBOUNCE_MS:?Set VIBEGRAPH_WATCHER_DEBOUNCE_MS in .env}
      VIBEGRAPH_TRUST_PROXY: ${VIBEGRAPH_TRUST_PROXY:?Set VIBEGRAPH_TRUST_PROXY in .env}
      VIBEGRAPH_TRUSTED_PROXIES: ${VIBEGRAPH_TRUSTED_PROXIES:?Set VIBEGRAPH_TRUSTED_PROXIES in .env}
      VIBEGRAPH_RATE_LIMIT_WINDOW_MAX_SIZE: ${VIBEGRAPH_RATE_LIMIT_WINDOW_MAX_SIZE:-100000}
      VIBEGRAPH_RATE_LIMIT_WINDOW_TTL_MS: ${VIBEGRAPH_RATE_LIMIT_WINDOW_TTL_MS:-180000}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL in .env}
      OAUTH_REDIRECT_BASE_URL: ${OAUTH_REDIRECT_BASE_URL:-http://localhost:8080}
      OAUTH_SUCCESS_PATH: ${OAUTH_SUCCESS_PATH:-/}
      OAUTH_LOGIN_PATH: ${OAUTH_LOGIN_PATH:-/login}
      VIBEGRAPH_CLI_DEVICE_FRONTEND_URL: ${VIBEGRAPH_CLI_DEVICE_FRONTEND_URL:-http://localhost:3000}
      VIBEGRAPH_CLI_DEVICE_TTL_SECONDS: ${VIBEGRAPH_CLI_DEVICE_TTL_SECONDS:-600}
      VIBEGRAPH_CLI_DEVICE_POLL_INTERVAL_SECONDS: ${VIBEGRAPH_CLI_DEVICE_POLL_INTERVAL_SECONDS:-2}
      VIBEGRAPH_CLI_DEVICE_CLEANUP_CRON: ${VIBEGRAPH_CLI_DEVICE_CLEANUP_CRON:-0 20 3 * * ?}
      VIBEGRAPH_MCP_TASK_RETENTION_ENABLED: ${VIBEGRAPH_MCP_TASK_RETENTION_ENABLED:-true}
      VIBEGRAPH_MCP_TASK_RETENTION_DAYS: ${VIBEGRAPH_MCP_TASK_RETENTION_DAYS:-90}
      VIBEGRAPH_MCP_TASK_RETENTION_BATCH_SIZE: ${VIBEGRAPH_MCP_TASK_RETENTION_BATCH_SIZE:-500}
      VIBEGRAPH_MCP_TASK_RETENTION_MAX_BATCHES: ${VIBEGRAPH_MCP_TASK_RETENTION_MAX_BATCHES:-20}
      VIBEGRAPH_MCP_TASK_RETENTION_CRON: ${VIBEGRAPH_MCP_TASK_RETENTION_CRON:-0 15 3 * * ?}
      # OAuth and Gemini were the only variables the removed .env mount still supplied.
      # application.yaml defaults them to `__disabled__` / empty, and nothing in the code
      # detects that placeholder — LoginView always renders the Google and GitHub buttons,
      # so without these the provider redirect fails with invalid_client. Passed explicitly
      # (not via a whole-file mount) with soft defaults so a stack without OAuth still boots.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_API_KEYS: ${GEMINI_API_KEYS:-}
    volumes:
      # H2: the .env mount is gone — every variable the app needs is passed explicitly in
      # the environment block above (spring.config.import is optional:), so the container
      # no longer carries the whole secret file for every process in it to read.
      # Writable local-path projects: the CLI Local Patch flow
      # (POST /api/projects/{id}/patch) applies file changes under /projects,
      # so this mount must be writable (was :ro, which blocked PATCH writes).
      - ./projects:/projects
      # Writable workspace for uploaded archives (archive upload flow)
      - upload-workspaces:/uploads
    healthcheck:
      # Spring Boot Actuator liveness — busybox wget ships in the JRE-alpine image.
      test: ["CMD", "wget", "-O", "/dev/null", "-q", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    build:
      context: ./vibegraph-web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:?Set VITE_API_URL in .env}
        VITE_WS_URL: ${VITE_WS_URL:?Set VITE_WS_URL in .env}
        VIBEGRAPH_DOCKER_BUILD: "true"
    container_name: vibegraph-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Nginx serves the SPA on port 80 inside the container.
      test: ["CMD", "wget", "-O", "/dev/null", "-q", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      VITE_API_URL: ${VITE_API_URL:?Set VITE_API_URL in .env}
      VITE_WS_URL: ${VITE_WS_URL:?Set VITE_WS_URL in .env}
      # Origins the page may call, injected into the CSP connect-src at container
      # start. Must list the API and WebSocket origins whenever they differ from the
      # origin serving the SPA, or the browser blocks every request the app makes.
      CSP_CONNECT_SRC: ${CSP_CONNECT_SRC:-${VITE_API_URL} ${VITE_WS_URL}}

volumes:
  postgres-data:
  neo4j-data:
  neo4j-logs:
  upload-workspaces:
